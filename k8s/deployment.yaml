apiVersion: apps/v1
kind: Deployment
metadata:
  name: fixmycampus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fixmycampus
  template:
    metadata:
      labels:
        app: fixmycampus
    spec:
      containers:
        - name: fixmycampus
          image: jaanu1317/fixmycampus:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8082
---
apiVersion: v1
kind: Service
metadata:
  name: fixmycampus-service
spec:
  type: NodePort
  selector:
    app: fixmycampus
  ports:
    - port: 8082
      targetPort: 8082
      nodePort: 30082
